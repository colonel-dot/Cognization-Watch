// Top-level build file where you can add configuration options common to all sub-projects/modules.

//buildscript块必须在 plugins 块之前
buildscript {
    // 配置仓库，确保能下载到 arouter-register
    repositories {
        // 国内镜像优先，解决 Maven Central / Google 直连超时/TLS 失败
        maven { url 'https://mirrors.aliyun.com/maven/public' }
        maven { url 'https://mirrors.aliyun.com/maven/google' }
        maven { url 'https://mirrors.aliyun.com/maven/central' }
        //maven { url 'https://repo.huaweicloud.com/repository/maven/' }
        google()
        mavenCentral()
    }

    dependencies {
        // 声明 arouter-register，这里用 classpath 是正确的
        classpath("com.alibaba:arouter-register:1.0.2")
    }
}

// 第二步：再写 plugins 块（在 buildscript 之后）
plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.android.library) apply false
    alias(libs.plugins.kotlin.android) apply false
}
